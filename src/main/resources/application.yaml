logging:
  level.root: WARN
  level.no.digdir: ${LOG_LEVEL:INFO}
  level.org.springframework: WARN
  level.org.springframework.web: WARN

spring:
  jackson:
    mapper:
      accept-case-insensitive-enums: true

server:
  port: 8080

management:
  endpoints:
    web:
      base-path: /
      path-mapping:
        info: ping
        health: ready
      exposure:
        include: health, info, prometheus


fdk:
  timeout: 5
  api: ${RESOURCE_SERVICE_URI}
  frontend: ${FDK_URI}
kudaf:
  timeout: 10
  soknadApi: ${KUDAF_FRONTEND_SOKNAD_API:https://frontend-soknad-api-staging.sokrates.edupaas.no/}

application:
  cors:
    originPatterns: ${CORS_ORIGIN_PATTERNS}

---
spring:
  config.activate.on-profile: dev

logging:
  level.no.digdir.accessrequestapi: DEBUG

fdk:
  api: https://resource.api.staging.fellesdatakatalog.digdir.no
  frontend: https://staging.fellesdatakatalog.digdir.no

application:
  cors:
    originPatterns: localhost:3001

---
spring:
  config.activate.on-profile: test

fdk:
  api: "http://localhost:6000"
  frontend: "http://localhost:6000"
kudaf:
  soknadApi: "http://localhost:6000"
